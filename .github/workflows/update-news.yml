name: Actualizar Noticias Stylo Camion

on:
  schedule:
    - cron: '17 */4 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update_news.py'
      - '.github/workflows/update-news.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stylo-news-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check feedparser

      - name: Actualizar noticias
        run: |
          for attempt in 1 2; do
            if python scripts/update_news.py; then
              exit 0
            fi

            if [ "$attempt" -lt 2 ]; then
              echo "La fuente no respondió. Nuevo intento completo en 30 segundos."
              sleep 30
            fi
          done

          echo "La fuente no respondió después de los reintentos completos."
          exit 1

      - name: Validar edición
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          payload = json.loads(Path("data/news.json").read_text(encoding="utf-8"))
          updated_at = payload.get("updated_at")
          items = payload.get("items", [])
          datetime.fromisoformat(updated_at.replace("Z", "+00:00"))
          if len(items) < 8:
              raise SystemExit("La edición no alcanza el mínimo de 8 noticias válidas")
          if not all(item.get("title") and item.get("url") and item.get("published_at") for item in items):
              raise SystemExit("Hay noticias incompletas")
          print(f"Edición válida: {len(items)} noticias · {updated_at}")
          PY

      - name: Guardar cambios
        run: |
          set -euo pipefail
          git config user.name "stylo-news-bot"
          git config user.email "actions@users.noreply.github.com"
          generated_file="$(mktemp)"
          trap 'rm -f "$generated_file"' EXIT
          cp data/news.json "$generated_file"

          for attempt in 1 2 3; do
            if ! git fetch origin main; then
              echo "No se pudo sincronizar main (intento $attempt/3)"
              sleep $((attempt * 5))
              continue
            fi

            # El runner es descartable. Partir del main más reciente evita
            # conflictos si se reintenta una ejecución antigua.
            git reset --hard origin/main

            decision="$(GENERATED_FILE="$generated_file" python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          MIN_ITEMS = 8

          def valid_timestamp(payload):
              if not isinstance(payload, dict):
                  return None
              items = payload.get("items")
              if not isinstance(items, list) or len(items) < MIN_ITEMS:
                  return None
              value = payload.get("updated_at")
              if not isinstance(value, str) or not value:
                  return None
              try:
                  stamp = datetime.fromisoformat(value.replace("Z", "+00:00"))
              except ValueError:
                  return None
              if stamp.tzinfo is None:
                  stamp = stamp.replace(tzinfo=timezone.utc)
              return stamp.astimezone(timezone.utc)

          def read_payload(path):
              try:
                  return json.loads(Path(path).read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  return None

          candidate_at = valid_timestamp(read_payload(os.environ["GENERATED_FILE"]))
          if candidate_at is None:
              raise SystemExit("La edición generada dejó de ser válida; no se publica")

          remote_at = valid_timestamp(read_payload("data/news.json"))
          if remote_at is not None and remote_at >= candidate_at:
              print(
                  f"Se conserva la edición remota ({remote_at.isoformat()}), "
                  f"más nueva o igual que la candidata ({candidate_at.isoformat()}).",
                  file=sys.stderr,
              )
              print("skip")
          else:
              if remote_at is None:
                  print("La edición remota no es válida; se publicará la candidata.", file=sys.stderr)
              else:
                  print(
                      f"La candidata ({candidate_at.isoformat()}) supera a la remota "
                      f"({remote_at.isoformat()}).",
                      file=sys.stderr,
                  )
              print("publish")
          PY
          )"

            if [ "$decision" = "skip" ]; then
              exit 0
            fi
            if [ "$decision" != "publish" ]; then
              echo "Decisión de publicación inesperada: $decision"
              exit 1
            fi

            cp "$generated_file" data/news.json
            git add data/news.json
            if git diff --cached --quiet; then
              echo "Sin cambios"
              exit 0
            fi

            git commit -m "Actualizar radar automático de noticias"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "El push falló; se volverá a comparar con el main más reciente."
            sleep $((attempt * 5))
          done

          echo "No se pudo publicar la edición después de 3 intentos"
          exit 1
